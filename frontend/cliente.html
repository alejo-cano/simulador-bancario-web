<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Banca Virtual Personas - Simulador Bancario</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
  <nav class="navbar navbar-dark bg-dark shadow-sm mb-4">
    <div class="container">
      <span class="navbar-brand fw-bold">🏦 Banca Virtual Personas</span>
      <div class="d-flex align-items-center gap-3 text-white">
        <span id="clienteNombre" class="small">Cliente</span>
        <a href="/cajero.html" class="btn btn-sm btn-outline-warning">Ir al Cajero</a>
        <button id="btnLogout" class="btn btn-sm btn-danger">Cerrar Sesión</button>
      </div>
    </div>
  </nav>

  <div class="container pb-5">
    <div id="alertaCliente" class="alert d-none"></div>

    <!-- Resumen de Cuenta -->
    <div class="card border-0 shadow-sm rounded-4 mb-4 bg-primary text-white">
      <div class="card-body p-4 d-flex flex-wrap justify-content-between align-items-center">
        <div>
          <span class="badge bg-light text-primary mb-2" id="ctaTipo">CUENTA DE AHORROS</span>
          <h4 class="mb-1 fw-bold">Cuenta N° <span id="ctaNumero">-</span></h4>
          <small class="opacity-75">Estado: <span id="ctaEstado">ACTIVO</span></small>
        </div>
        <div class="text-md-end mt-3 mt-md-0">
          <div class="small opacity-75">Saldo Disponible</div>
          <h2 class="fw-bold mb-0" id="ctaSaldo">$0</h2>
        </div>
      </div>
    </div>

    <div class="row g-4">
      <!-- Columna Izquierda: Transferencias, Perfil y Contraseña -->
      <div class="col-lg-4">
        <!-- Realizar Transferencia -->
        <div class="card border-0 shadow-sm mb-4">
          <div class="card-header bg-white fw-bold">💸 Transferir a otra cuenta</div>
          <div class="card-body">
            <form id="formTransferir">
              <div class="mb-2">
                <label class="form-label small">Cuenta Destino</label>
                <input type="text" id="transDestino" class="form-control form-control-sm" placeholder="Ej: 1001000002" required>
              </div>
              <div class="mb-2">
                <label class="form-label small">Valor a Transferir ($)</label>
                <input type="number" id="transValor" class="form-control form-control-sm" min="1" required>
              </div>
              <div class="mb-3">
                <label class="form-label small">Descripción / Concepto</label>
                <input type="text" id="transDesc" class="form-control form-control-sm" placeholder="Pago de servicios / amigos" required>
              </div>
              <button type="submit" class="btn btn-primary btn-sm w-100 fw-bold">Enviar Transferencia</button>
            </form>
          </div>
        </div>

        <!-- Información Personal / Perfil -->
        <div class="card border-0 shadow-sm mb-4">
          <div class="card-header bg-white fw-bold">👤 Mi Perfil Personal</div>
          <div class="card-body">
            <form id="formPerfil">
              <div class="mb-2">
                <label class="form-label small text-muted">Documento (No editable)</label>
                <input type="text" id="perfDoc" class="form-control form-control-sm bg-light" disabled>
              </div>
              <div class="mb-2">
                <label class="form-label small">Correo Electrónico</label>
                <input type="email" id="perfEmail" class="form-control form-control-sm" required>
              </div>
              <div class="mb-2">
                <label class="form-label small">Teléfono</label>
                <input type="text" id="perfTel" class="form-control form-control-sm" required>
              </div>
              <div class="mb-3">
                <label class="form-label small">Dirección</label>
                <input type="text" id="perfDir" class="form-control form-control-sm" required>
              </div>
              <button type="submit" class="btn btn-outline-primary btn-sm w-100 fw-semibold">Actualizar Datos</button>
            </form>
          </div>
        </div>

        <!-- Cambiar Contraseña -->
        <div class="card border-0 shadow-sm">
          <div class="card-header bg-white fw-bold">🔒 Cambiar Contraseña</div>
          <div class="card-body">
            <form id="formPassword">
              <div class="mb-2">
                <input type="password" id="passActual" class="form-control form-control-sm" placeholder="Contraseña actual" required>
              </div>
              <div class="mb-3">
                <input type="password" id="passNueva" class="form-control form-control-sm" placeholder="Nueva contraseña (mín. 6 caracteres)" minlength="6" required>
              </div>
              <button type="submit" class="btn btn-outline-dark btn-sm w-100 fw-semibold">Cambiar Contraseña</button>
            </form>
          </div>
        </div>
      </div>

      <!-- Columna Derecha: Historial de Movimientos -->
      <div class="col-lg-8">
        <div class="card border-0 shadow-sm">
          <div class="card-header bg-white d-flex justify-content-between align-items-center">
            <span class="fw-bold">📑 Historial de Movimientos Financieros</span>
            <button class="btn btn-sm btn-outline-secondary" onclick="cargarResumen()">🔄 Actualizar</button>
          </div>
          <div class="card-body table-responsive">
            <table class="table table-hover align-middle mb-0">
              <thead class="table-light">
                <tr>
                  <th>Fecha</th>
                  <th>Tipo</th>
                  <th>Descripción</th>
                  <th>Valor</th>
                  <th>Saldo Resultante</th>
                </tr>
              </thead>
              <tbody id="tablaMovimientosCliente"></tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const formatoMoneda = (n) => Number(n).toLocaleString('es-CO', { style: 'currency', currency: 'COP', maximumFractionDigits: 0 });
    const alertaCliente = document.getElementById('alertaCliente');

    function notificar(msg, tipo = 'success') {
      alertaCliente.className = `alert alert-${tipo}`;
      alertaCliente.textContent = msg;
      setTimeout(() => alertaCliente.className = 'alert d-none', 4500);
    }

    async function cargarResumen() {
      const res = await fetch('/api/cliente/resumen').then(r => r.json());
      if (!res.ok) {
        window.location.href = '/index.html';
        return;
      }

      document.getElementById('clienteNombre').textContent = res.perfil.nombre_completo;
      document.getElementById('ctaTipo').textContent = `CUENTA DE ${res.cuenta.tipo_cuenta}`;
      document.getElementById('ctaNumero').textContent = res.cuenta.numero_cuenta;
      document.getElementById('ctaEstado').textContent = res.cuenta.estado;
      document.getElementById('ctaSaldo').textContent = formatoMoneda(res.cuenta.saldo);

      document.getElementById('perfDoc').value = res.perfil.documento;
      document.getElementById('perfEmail').value = res.perfil.email;
      document.getElementById('perfTel').value = res.perfil.telefono;
      document.getElementById('perfDir').value = res.perfil.direccion;

      const tbody = document.getElementById('tablaMovimientosCliente');
      tbody.innerHTML = res.movimientos.map(m => {
        const esSalida = m.tipo_movimiento === 'RETIRO_CAJERO' || m.tipo_movimiento === 'TRANSFERENCIA_ENVIADA';
        return `
          <tr>
            <td><small>${new Date(m.fecha).toLocaleString('es-CO')}</small></td>
            <td><span class="badge ${esSalida ? 'bg-warning text-dark' : 'bg-success'}">${m.tipo_movimiento}</span></td>
            <td><small>${m.descripcion}</small></td>
            <td class="fw-bold ${esSalida ? 'text-danger' : 'text-success'}">${esSalida ? '-' : '+'}${formatoMoneda(m.valor)}</td>
            <td class="fw-semibold">${formatoMoneda(m.saldo_resultante)}</td>
          </tr>
        `;
      }).join('');
    }

    document.getElementById('formTransferir').addEventListener('submit', async (e) => {
      e.preventDefault();
      const body = {
        cuenta_destino: document.getElementById('transDestino').value.trim(),
        valor: document.getElementById('transValor').value,
        descripcion: document.getElementById('transDesc').value
      };
      const res = await fetch('/api/cliente/transferir', {
        method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body)
      }).then(r => r.json());

      notificar(res.mensaje, res.ok ? 'success' : 'danger');
      if (res.ok) { e.target.reset(); cargarResumen(); }
    });

    document.getElementById('formPerfil').addEventListener('submit', async (e) => {
      e.preventDefault();
      const body = {
        email: document.getElementById('perfEmail').value,
        telefono: document.getElementById('perfTel').value,
        direccion: document.getElementById('perfDir').value
      };
      const res = await fetch('/api/cliente/perfil', {
        method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body)
      }).then(r => r.json());
      notificar(res.mensaje, res.ok ? 'success' : 'danger');
      if (res.ok) cargarResumen();
    });

    document.getElementById('formPassword').addEventListener('submit', async (e) => {
      e.preventDefault();
      const body = {
        password_actual: document.getElementById('passActual').value,
        password_nueva: document.getElementById('passNueva').value
      };
      const res = await fetch('/api/cliente/password', {
        method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body)
      }).then(r => r.json());
      notificar(res.mensaje, res.ok ? 'success' : 'danger');
      if (res.ok) e.target.reset();
    });

    document.getElementById('btnLogout').addEventListener('click', async () => {
      await fetch('/api/auth/logout', { method: 'POST' });
      window.location.href = '/index.html';
    });

    cargarResumen();
  </script>
</body>
</html>
